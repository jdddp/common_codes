model:
  num_classes: 4
  width_mult: 0.29
  depth_mult: 0.33
  reg_max: 16
  strides: [8, 16, 32]

loss:
  box_weight: 5.5 #7.5
  cls_weight: 1.0
  dfl_weight: 0.5 #1.5

assigner:
  topk: 15
  alpha: 0.5
  beta: 5.0

debug:
  assigner_stats: true
  assigner_log_interval: 50

train:
  image_size: 640
  epochs: 100
  batch_size: 48
  num_workers: 8
  persistent_workers: true
  prefetch_factor: 4
  cudnn_benchmark: true
  device: cuda
  amp: true
  optimizer: adamw
  lr: 0.00125
  lrf: 0.01
  cos_lr: false
  momentum: 0.9
  weight_decay: 0.0005
  nbs: 64
  warmup_epochs: 3
  warmup_momentum: 0.8
  warmup_bias_lr: 0.1
  out_dir: runs/yolov8n_parammatch_cy
  seed: 42
  ema: true
  ema_decay: 0.9999
  multi_scale: false
  multi_scale_range: [0.8, 1.2]
  multi_scale_stride: 32
  close_aug: 10
  val_interval: 1
  final_val_epochs: 10

val:
  fast_val: true
  conf_threshold: 0.001
  nms_iou_threshold: 0.65
  max_det: 300

augment:
  hsv_h: 0.015
  hsv_s: 0.7
  hsv_v: 0.4
  hsv_prob: 1.0
  fliplr: 0.5
  degrees: 0.0
  translate: 0.1
  scale: 0.2
  shear: 0.0
  perspective: 0.0
  perspective_prob: 1.0
  border_value: [114, 114, 114]

dataset:
  train_images: "/home/poly/jzp/src_yolo/images/train"
  train_labels: "/home/poly/jzp/src_yolo/labels/train"
  val_images: "/home/poly/jzp/src_yolo/images/val"
  val_labels: "/home/poly/jzp/src_yolo/labels/val"
  names:
    - fish2
    - zl
    - yq
    - hdy
